name: Security Bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', bench/app]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Audit the independent lockfile without installing packages
        working-directory: ${{ matrix.directory }}
        run: pnpm --ignore-workspace audit --registry=https://registry.npmjs.org --audit-level=low --json > "$RUNNER_TEMP/dependency-audit.json"
      - name: Preserve audit evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Zero findings must describe the whole revision on PRs and on main.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize security analysis
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze source and publish code scanning results
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql-results
      - name: Require complete analysis with zero findings
        shell: bash
        env:
          SARIF_DIRECTORY: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          shopt -s globstar nullglob dotglob
          reports=("${SARIF_DIRECTORY:?Missing CodeQL output directory}"/**/*.sarif)
          if (( ${#reports[@]} == 0 )); then
            echo "No CodeQL SARIF reports found" >&2
            exit 1
          fi

          jq --compact-output --slurp --exit-status '
            def successful:
              .executionSuccessful != false and
              ((has("exitCode") | not) or .exitCode == 0) and
              all([.toolExecutionNotifications, .toolConfigurationNotifications][] | select(. != null);
                type == "array" and all(.[]; .level != "error"));

            def complete_run:
              .tool.driver.name == "CodeQL" and
              (.results | type == "array") and
              ((if has("invocations") then .invocations else [] end) |
                type == "array" and all(.[]; successful));

            if length == 0 or
              any(.[]; (.version == "2.1.0" and
                (.runs | type == "array" and length > 0 and all(.[]; complete_run))) | not)
            then error("Missing or incomplete CodeQL analysis")
            else
              [.[].runs[]] as $runs |
              [$runs[].results[]] as $findings |
              {runs: ($runs | length), findings: ($findings | length)},
              ($findings[] | {ruleId, level, message, locations}),
              ($findings | length == 0)
            end
          ' "${reports[@]}"
      - name: Preserve code-scanning evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 30
