name: Release main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release must finish before the next release can start; never cancel a publication.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  benchmark:
    uses: ./.github/workflows/bench.yml
    with:
      base_ref: HEAD^
      tiers: '10'
      duration: 5

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [verify, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ISR_TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout the verified commit and complete release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.12.1 --registry=https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify automatic version policy
        run: pnpm run test:release
      - name: Audit independent benchmark dependencies
        working-directory: bench/app
        run: pnpm --ignore-workspace audit --registry=https://registry.npmjs.org --audit-level=low
      - name: Calculate version, verify versioned artifacts and publish with npm OIDC
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve release archives even after a publication failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/*.tgz
          if-no-files-found: ignore
          retention-days: 30
