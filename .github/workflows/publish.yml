name: Release main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A release must finish before the next release can start; never cancel a publication.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security-bot.yml

  benchmark:
    uses: ./.github/workflows/bench.yml
    with:
      base_ref: HEAD^
      tiers: '10'
      duration: 5

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [verify, benchmark, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout the verified commit and complete release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.12.1 --registry=https://registry.npmjs.org
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Calculate version, verify versioned artifacts and publish with npm OIDC
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve release archives even after a publication failure
        if: ${{ always() && hashFiles('.release/*.tgz') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/*.tgz
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
