name: Bench (perf regression gate)

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Revision to measure as baseline on this runner'
        type: string
        required: false
        default: 'HEAD^'
      tiers:
        description: 'concurrency tiers (comma-separated)'
        type: string
        required: false
        default: '10'
      duration:
        description: 'seconds per warm/SSR tier (regeneration always >=75s)'
        type: number
        required: false
        default: 5
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Revision to measure as baseline on this runner (default HEAD^)'
        required: false
        default: 'HEAD^'
      tiers:
        description: 'concurrency tiers (comma-separated)'
        required: false
        default: '10,100,1000'
      duration:
        description: 'seconds per warm/SSR tier (regeneration always >=75s)'
        required: false
        default: '15'
  schedule:
    - cron: '0 2 * * *'
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - '.github/workflows/bench.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Measure both revisions + required regression comparison
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      BENCH_TIERS: ${{ inputs.tiers || '10,100,1000' }}
      BENCH_RUNNER_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      BENCH_MAX_ERRORS: '0'
      BENCH_MAX_NON_2XX_RATE: '0'
      BENCH_WARMUP_SECONDS: '3'
      BENCH_COOLDOWN_MS: '2000'
      BENCH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve distinct baseline revision
        id: revisions
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'HEAD^' }}
        run: |
          base=$(git rev-parse --verify "$BASE_REF^{commit}")
          current=$(git rev-parse HEAD)
          test "$base" != "$current" || { echo 'Baseline must be a distinct revision'; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.revisions.outputs.base }}
          path: .bench-baseline

      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Build both engines with the same benchmark fixture
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          # Use the current fixture for both engine revisions; keep each engine's locked dependencies.
          rsync -a --delete --exclude=node_modules --exclude=dist bench/app/ .bench-baseline/bench/app/
          (cd .bench-baseline && pnpm install --frozen-lockfile && pnpm run build)
          (cd bench/app && pnpm install --ignore-workspace --frozen-lockfile && pnpm run build)
          (cd .bench-baseline/bench/app && pnpm install --ignore-workspace --frozen-lockfile && pnpm run build)

      - name: Measure baseline and current sequentially on this runner
        env:
          WARM_DURATION: ${{ inputs.duration || '15' }}
          BASE_REVISION: ${{ steps.revisions.outputs.base }}
          CURRENT_REVISION: ${{ steps.revisions.outputs.current }}
          NODE_ENV: production
          PORT: '3000'
          SITE_URL: http://127.0.0.1:3000
        shell: bash
        run: |
          set -euo pipefail
          harness="$PWD/bench/runner.mjs"
          artifact_dir="$PWD"
          stop_app() {
            if [ -n "${app_pid:-}" ]; then
              node "$artifact_dir/bench/stop-app.mjs" "$app_pid" 3000 || return $?
              # Reap the already-confirmed exited launcher; TERM/KILL exit codes are expected.
              wait "$app_pid" 2>/dev/null || :
              app_pid=''
            fi
          }
          trap stop_app EXIT
          for revision in baseline current; do
            if [ "$revision" = baseline ]; then
              app_dir="$artifact_dir/.bench-baseline/bench/app"
              export BENCH_SOURCE_REVISION="$BASE_REVISION"
            else
              app_dir="$artifact_dir/bench/app"
              export BENCH_SOURCE_REVISION="$CURRENT_REVISION"
            fi
            for scenario in warm ssr regeneration; do
              # A fresh process/cache per scenario keeps both revisions' starting conditions equal.
              (cd "$app_dir" && exec setsid pnpm run start) > "$artifact_dir/bench-$revision-$scenario.log" 2>&1 &
              app_pid=$!
              ready=0
              for _attempt in $(seq 1 30); do
                if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then ready=1; break; fi
                sleep 1
              done
              test "$ready" = 1 || { cat "$artifact_dir/bench-$revision-$scenario.log"; exit 1; }
              export BENCH_SCENARIO="$scenario"
              export BENCH_DURATION="$WARM_DURATION"
              if [ "$scenario" = regeneration ]; then export BENCH_DURATION=75; fi
              export BENCH_OUTPUT="$artifact_dir/bench-$revision-$scenario.json"
              node "$harness"
              stop_app
            done
          done

      - name: Require all scenario comparisons
        env:
          BENCH_P95_REGRESSION_PCT: '20'
          BENCH_QPS_REGRESSION_PCT: '15'
        run: |
          for scenario in warm ssr regeneration; do
            node bench/compare.mjs "bench-baseline-$scenario.json" "bench-current-$scenario.json"
          done

      - name: Upload measured evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-${{ github.sha }}
          path: |
            bench-baseline-*.json
            bench-current-*.json
            bench-*.log
          retention-days: 30
