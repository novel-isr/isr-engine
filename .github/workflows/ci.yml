name: CI

# 触发：任何 push 到任何分支 + PR 到 main/develop
# Node 版本由 package.json engines + .nvmrc 共同声明；CI 通过 setup-node
# 读取 .nvmrc。corepack 接管 pnpm（packageManager 字段是 source of truth）。

on:
  workflow_call:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers-runtime:
    name: Official workerd runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm build
      - name: Verify official Workers runtime
        run: pnpm test:workers

  windows-contracts:
    name: Windows build and runtime contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install locked pnpm CLI
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'pnpm'
          $packageManager = npm pkg get packageManager | ConvertFrom-Json
          npm install --global --prefix $prefix $packageManager
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test filesystem and policy contracts
        run: pnpm exec vitest run src/ssg/__tests__/spider.test.ts src/ssg/__tests__/route-identity.test.ts src/engine/__tests__/RenderMode.test.ts src/plugin/__tests__/cacheConfiguration.test.ts src/plugin/__tests__/cacheDurationContract.test.ts
      - name: Build
        run: pnpm build
      - name: Verify the package in an independent production app
        run: pnpm test:package

  lint-and-format:
    name: Lint + Type + Format + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Diagnostics
        run: |
          node --version
          pnpm --version
          which node
          which pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all locked dependencies
        # Query the official advisory service; mirror registries may not expose it.
        run: pnpm run audit:security

      - name: Verify release policy
        run: pnpm run test:release

      - name: Type check
        run: pnpm run type-check

      - name: Lint (includes Prettier check via eslint-plugin-prettier)
        run: pnpm run lint

      - name: Build through the npm release lifecycle
        run: npm version 0.0.0-ci --no-git-tag-version

      - name: Verify the archive through the publish-time package check
        run: |
          archive=$(npm pack --ignore-scripts --loglevel=error --pack-destination "$RUNNER_TEMP")
          pnpm run test:package "$RUNNER_TEMP/$archive"
          npm publish "$RUNNER_TEMP/$archive" --tag latest --dry-run --loglevel=error

  test:
    name: Unit + Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ISR_TEST_REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  browser:
    name: Production Browser Regressions
    runs-on: ubuntu-24.04
    container:
      # Match the locked Playwright version; browsers and OS dependencies are preinstalled.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --init --ipc=host
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PLAYWRIGHT_REDIS_URL: redis://redis:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test development navigation and styles
        run: pnpm run test:browser
      - name: Test built production server
        run: pnpm run test:browser:production
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
