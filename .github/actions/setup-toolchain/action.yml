name: Set up the pinned Node.js and pnpm toolchain
description: Install the Node.js and pnpm versions declared by the repository.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        package-manager-cache: false
    - name: Install the locked pnpm version
      shell: bash
      run: |
        prefix=$(node -p "require('node:path').join(process.env.RUNNER_TEMP, 'pnpm')")
        package_manager=$(node -p "require('./package.json').packageManager")
        npm install --global --prefix "$prefix" "$package_manager"
        node -p "process.platform === 'win32' ? process.argv[1] : require('node:path').join(process.argv[1], 'bin')" "$prefix" >> "$GITHUB_PATH"
